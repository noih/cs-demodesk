[package]
name = "demodesk-core"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "CS DemoDesk core — CS2 demo parsing, highlight detection, statistics and HLAE rendering (no Tauri dependency)"

[dependencies]
csgoproto = { path = "../../vendor/demoparser/csgoproto" }
prost = "0.13.3"
parser = { path = "../../vendor/demoparser/parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
anyhow = "1"
ahash = "0.8"
sha1_smol = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security"] }


[build-dependencies]
cc = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
