[package]
name = "demodesk-core"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "CS DemoDesk core — CS2 demo parsing, highlight detection, statistics and HLAE rendering (no Tauri dependency)"

[dependencies]
parser = { path = "../../vendor/demoparser/parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ahash = "0.8"
sha1_smol = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json", "platform-verifier"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

