# Builds the portable Windows executable for a version tag, attaches a
# build-provenance attestation (Sigstore, via GitHub) and publishes a release.
# Verify a download with: gh attestation verify CS-DemoDesk-<version>.exe --owner noih
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run app:build

      - name: Checksum
        shell: pwsh
        run: |
          $exe = Get-Item dist-portable/*.exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii dist-portable/SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist-portable/*.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/*.exe
            dist-portable/SHA256SUMS
          generate_release_notes: true
