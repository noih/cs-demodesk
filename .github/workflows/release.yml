# Builds portable EXE and unsigned Store MSIX for a version tag, attaches a
# build-provenance attestation (Sigstore, via GitHub), publishes the EXE, and
# retains the Store submission package as an Actions artifact.
# Verify a download with: gh attestation verify CS-DemoDesk-<version>.exe --owner noih
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run test:privacy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run app:release

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($bundle in @(@('dist-portable', '*.exe'), @('out/msix', '*.msix'))) {
            Get-Item (Join-Path $bundle[0] $bundle[1]) | ForEach-Object {
              $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -Encoding ascii (Join-Path $bundle[0] 'SHA256SUMS')
          }

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-portable/*.exe
            out/msix/*.msix

      - name: Upload Store submission package
        uses: actions/upload-artifact@v7
        with:
          name: store-msix-${{ github.ref_name }}
          path: |
            out/msix/*.msix
            out/msix/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/*.exe
            dist-portable/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            The .exe is the standalone download.
            Microsoft Store: https://apps.microsoft.com/detail/9N5G4VXSDGS5
