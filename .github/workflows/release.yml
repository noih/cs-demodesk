# Builds portable EXE and unsigned Store MSIX for a version tag, attaches a
# build-provenance attestation (Sigstore, via GitHub), publishes the EXE, and
# retains the Store submission package as an Actions artifact.
# Verify a download with: gh attestation verify CS-DemoDesk-<version>.exe --owner noih
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release flow
        shell: pwsh
        run: ./scripts/test-release.ps1

      - name: Verify draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Commit $env:RELEASE_COMMIT -CheckOnly

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm run test:privacy

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run app:release

      - name: Checksum
        shell: pwsh
        run: |
          foreach ($bundle in @(@('dist-portable', '*.exe'), @('out/msix', '*.msix'))) {
            Get-Item (Join-Path $bundle[0] $bundle[1]) | ForEach-Object {
              $hash = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -Encoding ascii (Join-Path $bundle[0] 'SHA256SUMS')
          }

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist-portable/*.exe
            out/msix/*.msix

      - name: Upload Store submission package
        uses: actions/upload-artifact@v7
        with:
          name: store-msix-${{ github.ref_name }}
          path: |
            out/msix/*.msix
            out/msix/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Publish prepared release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/publish-release.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY -Commit $env:RELEASE_COMMIT
